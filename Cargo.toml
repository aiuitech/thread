[workspace]
resolver = "2"
members = ["crates/thread-core", "crates/thread-wasm", "crates/thread-cli", "crates/thread-py"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# The Python extension (crates/thread-py, built by maturin with `--profile python`): a panic must
# unwind into a Python exception instead of aborting the interpreter.
[profile.python]
inherits = "release"
panic = "unwind"
