[package]
name = "thread-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings (PyO3) over thread-core, for the thread_sdk package. Pure compute: the Python side does every read and write."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
thread-core = { path = "../thread-core" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
